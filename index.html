<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F5F0">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="McAfee Family">
<title>McAfee Family</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
  <div class="main">
    <header class="hdr">
      <div class="hdr-date"><small id="hdrDay"></small><b id="hdrDate"></b></div>
      <button class="hdr-wx" id="hdrWx" type="button" aria-haspopup="dialog" aria-expanded="false"></button>
      <time class="hdr-time" id="hdrTime"></time>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Main"></nav>
<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button class="btn btn-ghost" id="toastUndo" type="button">Undo</button>
</div>
<noscript><p style="padding:24px">This app needs JavaScript turned on.</p></noscript>
</body>
</html>
